<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Spam Email Detection System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app-theme.css}">
    <script th:src="@{/js/app-effects.js}" defer></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 28px 16px;
        }

        .auth-shell {
            width: min(100%, 520px);
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
            color: var(--text);
            font-weight: 800;
            letter-spacing: -0.02em;
            text-decoration: none;
        }

        .brand-mark {
            display: grid;
            width: 44px;
            height: 44px;
            place-items: center;
            border-radius: 14px;
            color: #081120;
            background: linear-gradient(135deg, #7dd3fc, #a7f3d0);
            box-shadow: 0 18px 40px rgba(125, 211, 252, 0.18);
            font-size: 1.2rem;
        }

        .branding-text {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            font-size: 1.05rem;
            line-height: 1.1;
        }

        .branding-text small {
            color: var(--muted);
            font-weight: 500;
        }

        .register-card {
            position: relative;
            padding: 30px 28px 26px;
            border: 1px solid var(--line);
            border-radius: 24px;
            background: var(--panel);
            box-shadow: 0 28px 70px rgba(0, 0, 0, 0.22);
            backdrop-filter: blur(14px);
        }

        .register-header {
            margin-bottom: 22px;
            text-align: center;
        }

        .register-header h1 {
            margin: 0;
            font-size: clamp(2rem, 4vw, 2.5rem);
            font-weight: 800;
            letter-spacing: -0.04em;
        }

        .register-header p {
            margin: 6px 0 0;
            color: var(--muted);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 18px;
            color: var(--accent);
            font-weight: 600;
            text-decoration: none;
        }

        .form-label {
            margin-bottom: 8px;
            color: var(--text);
            font-weight: 600;
        }

        .form-control {
            margin-bottom: 8px;
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: 12px;
            color: var(--text);
            background: rgba(255, 255, 255, 0.04);
        }

        .btn-register {
            width: 100%;
            padding: 14px 18px;
            border: 0;
            border-radius: 14px;
            color: #081120;
            background: linear-gradient(135deg, #7dd3fc, #a7f3d0);
            box-shadow: 0 18px 40px rgba(125, 211, 252, 0.18);
            font-weight: 800;
        }

        .alt-action {
            margin-top: 18px;
            color: var(--muted);
            text-align: center;
        }

        .alt-action a {
            color: var(--accent);
            font-weight: 700;
            text-decoration: none;
        }

        @media (max-width: 480px) {
            .register-card {
                padding: 24px 18px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-shell">
        <a class="brand" href="/" aria-label="Back to home">
            <div class="brand-mark">✉</div>
            <div class="branding-text">
                <span>Spam Email Detection</span>
                <small>Rule-based analysis platform</small>
            </div>
        </a>

        <div class="register-card">
            <div class="register-header">
                <h1>Create Account</h1>
                <p>Register to start analyzing emails and reviewing your history.</p>
            </div>

            <a href="/" class="back-link">← Back to Home</a>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

            <form th:action="@{/register}" method="post" th:object="${registrationRequest}">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" th:field="*{username}" required th:classappend="${#fields.hasErrors('username')} ? ' is-invalid' : ''">
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" th:field="*{email}" required th:classappend="${#fields.hasErrors('email')} ? ' is-invalid' : ''">
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" th:field="*{password}" required th:classappend="${#fields.hasErrors('password')} ? ' is-invalid' : ''">
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>

                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" id="confirmPassword" th:field="*{confirmPassword}" required th:classappend="${#fields.hasErrors('confirmPassword')} ? ' is-invalid' : ''">
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                </div>

                <button type="submit" class="btn btn-register">Create Account</button>
            </form>

            <p class="alt-action">Already have an account? <a href="/login">Login here</a></p>
        </div>
    </div>
</body>
</html>
